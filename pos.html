<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POS System</title>
<style>
  /* ---------- Color palette ----------
     Saare colors ek jagah rakhe hain (CSS variables) taaki
     future mein badalna ho toh sirf yahan change karna padega. */
  :root {
    --bg: #1C1E22;              /* poore page ka background (dark charcoal) */
    --card: #24272C;            /* products area ka background */
    --card-item: #2C2F35;       /* har product card ka background */
    --card-border: #34373D;     /* borders dark side pe */
    --amber: #E3A438;           /* main accent — active tab, heading */
    --green: #3FAE6B;           /* ADD button ka color (image 1 se liya) */
    --green-dark: #2F8C55;      /* ADD button hover */
    --text-light: #ECEDEE;      /* dark background pe text */
    --text-light-muted: #9A9EA6;

    --paper: #F6F1E7;           /* order panel ka background (cream/paper) */
    --paper-border: #DED2B8;
    --paper-ink: #2B2620;       /* paper ke upar text */
    --paper-ink-muted: #8A8070;

    --danger: #C96A5A;
  }

  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 20px;
    color: var(--text-light);
  }

  h1 {
    text-align: center;
    color: var(--amber);
    margin-bottom: 20px;
  }

  .container {
    display: flex;
    gap: 20px;
    max-width: 950px;
    margin: 0 auto;
    flex-wrap: wrap;
  }

  /* ============ LEFT: Products area ============ */
  .products {
    flex: 2;
    min-width: 300px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 18px;
  }

  /* Category tabs — ab icon + naam dono, reference image jaisa column layout */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-light-muted);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 64px;
  }

  .tab-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
  }

  .tab-btn.active {
    background: rgba(227, 164, 56, 0.12);
    border-color: var(--amber);
    color: var(--amber);
    font-weight: bold;
  }

  /* Products grid (image 1 jaisa card layout, stacked list ki jagah) */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .product-card {
    background: var(--card-item);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }

  /* Product photo — asli image dikhta hai (loremflickr se, product name ke
     hisaab se keyword search hoke aati hai). object-fit: cover se image
     circle ke andar crop ho ke fit ho jaati hai, chahe uska size kuch bhi ho. */
  .product-photo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: linear-gradient(155deg, var(--photo-a, #3A3E46), var(--photo-b, #2C2F35));
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
  }

  /* Agar photo load na ho paaye (internet na ho, ya link kaam na kare) toh
     iski jagah wahi purana colorful emoji-badge dikh jaata hai — kabhi bhi
     khaali/tooti hui image nahi dikhegi */
  .photo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .product-card .pname {
    font-size: 13.5px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    line-height: 1.3;
  }

  /* Cart ki list mein icon thoda chhota rakha (paper panel choti jagah hai) */
  .cart-picon {
    font-size: 16px;
    margin-right: 3px;
  }

  /* Veg/non-veg indicator — standard green/brown square with a dot inside,
     jaisa Indian restaurant menus mein dikhta hai */
  .veg-icon, .nonveg-icon {
    width: 11px;
    height: 11px;
    border: 1.5px solid;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .veg-icon {
    border-color: #2E9E4F;
  }

  .veg-icon::after {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2E9E4F;
  }

  .nonveg-icon {
    border-color: #A0342A;
  }

  .nonveg-icon::after {
    content: "";
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 6px solid #A0342A;
  }

  .product-card .prow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .product-card .pprice {
    color: var(--amber);
    font-size: 14px;
  }

  /* ADD button — image 1 se liya green pill style, ab poori width */
  .add-btn {
    background: var(--green);
    color: white;
    border: none;
    padding: 6px 0;
    width: 100%;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .add-btn:hover {
    background: var(--green-dark);
  }

  /* ============ RIGHT: Order panel (image 2 jaisa cream panel) ============ */
  .order-panel {
    flex: 1;
    min-width: 260px;
    background: var(--paper);
    border: 1px solid var(--paper-border);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
  }

  .order-panel h2 {
    color: var(--paper-ink);
    font-size: 16px;
    margin: 0 0 12px;
  }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--paper-border);
    color: var(--paper-ink);
    font-size: 14px;
  }

  .qty-btn {
    background: #FFFFFF;
    border: 1px solid var(--paper-border);
    color: var(--paper-ink);
    width: 22px;
    height: 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }

  .qty-btn:hover {
    background: var(--amber);
    border-color: var(--amber);
    color: #fff;
  }

  .qty-input {
    width: 34px;
    height: 22px;
    text-align: center;
    border: 1px solid var(--paper-border);
    border-radius: 4px;
    font-size: 13px;
    margin: 0 4px;
    color: var(--paper-ink);
    background: #FFFFFF;
  }

  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .empty-msg {
    color: var(--paper-ink-muted);
    text-align: center;
    padding: 20px 0;
    font-size: 14px;
  }

  /* Subtotal / Tax / Due breakdown — image 2 se liya */
  .totals {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--paper-border);
  }

  .totals-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--paper-ink-muted);
    padding: 3px 0;
  }

  .totals-row.due {
    color: var(--paper-ink);
    font-size: 19px;
    font-weight: bold;
    border-top: 2px solid var(--amber);
    margin-top: 6px;
    padding-top: 8px;
  }

  .clear-btn {
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    background: var(--paper-ink);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }

  .clear-btn:hover {
    background: #000000;
  }
</style>
</head>
<body>

<h1>🛒 POS System</h1>

<div class="container">

  <!-- ============ LEFT SIDE: Categories + Products ============ -->
  <div class="products">

    <!-- Category tabs. Click karne se sirf us category ke products dikhte hain -->
    <div class="tabs" id="tabs"></div>

    <!-- Products yahan JavaScript se render honge -->
    <div class="grid" id="grid"></div>
  </div>

  <!-- ============ RIGHT SIDE: Order panel ============ -->
  <div class="order-panel">
    <h2>Current Order</h2>

    <div id="cartItems">
      <p class="empty-msg">No items yet.<br>Tap ADD on a product.</p>
    </div>

    <div class="totals">
      <div class="totals-row">
        <span>Subtotal</span>
        <span>₹<span id="subtotal">0</span></span>
      </div>
      <div class="totals-row">
        <span>Tax (5%)</span>
        <span>₹<span id="tax">0</span></span>
      </div>
      <div class="totals-row due">
        <span>Due</span>
        <span>₹<span id="due">0</span></span>
      </div>
    </div>

    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
  </div>

</div>

<script>
  // ---------- Step 1: Products ko categories mein baanta gaya ----------
  // Har category ke andar uske products ki list hai (name + price)
  const CATALOG = {
    "Tea": [
      { name: "Masala Chai", price: 10, icon: "🍵", photoCategory: "chai" },
      { name: "Ginger Tea", price: 12, icon: "🍵", photoCategory: "chai" },
      { name: "Lemon Tea", price: 12, icon: "🍋", photoCategory: "chai" },
      { name: "Green Tea", price: 15, icon: "🍵", photoCategory: "chai" },
      { name: "Kesar Chai", price: 20, icon: "🍵", photoCategory: "chai" },
    ],
    "Coffee": [
      { name: "Black Coffee", price: 15, icon: "☕" },
      { name: "Espresso", price: 25, icon: "☕" },
      { name: "Cappuccino", price: 30, icon: "☕" },
      { name: "Latte", price: 35, icon: "☕" },
      { name: "Cold Coffee", price: 40, icon: "🥤" },
      { name: "Mocha", price: 40, icon: "☕" },
    ],
    "Cold Drinks": [
      { name: "Coca-Cola", price: 25, icon: "🥤" },
      { name: "Pepsi", price: 25, icon: "🥤" },
      { name: "Sprite", price: 25, icon: "🥤" },
      { name: "Lemonade", price: 20, icon: "🍋" },
      { name: "Iced Tea", price: 30, icon: "🧋" },
      { name: "Mojito", price: 40, icon: "🍹" },
    ],
    "Snacks": [
      { name: "Samosa", price: 15, veg: true, icon: "🥟", photoCategory: "samosa" },
      { name: "Veg Sandwich", price: 35, veg: true, icon: "🥪" },
      { name: "Chicken Sandwich", price: 50, veg: false, icon: "🥪" },
      { name: "Biscuit", price: 5, veg: true, icon: "🍪" },
    ],
    "Pizza": [
      { name: "Margherita Pizza", price: 140, veg: true, icon: "🍕", photoCategory: "pizza" },
      { name: "Farmhouse Pizza", price: 170, veg: true, icon: "🍕", photoCategory: "pizza" },
      { name: "Paneer Tikka Pizza", price: 180, veg: true, icon: "🍕", photoCategory: "pizza" },
      { name: "Chicken Pizza", price: 180, veg: false, icon: "🍕", photoCategory: "pizza" },
      { name: "Pepperoni Pizza", price: 200, veg: false, icon: "🍕", photoCategory: "pizza" },
    ],
    "Fast Food": [
      { name: "Veg Burger", price: 55, veg: true, icon: "🍔", photoCategory: "burger" },
      { name: "Chicken Burger", price: 75, veg: false, icon: "🍔", photoCategory: "burger" },
      { name: "Fries", price: 50, veg: true, icon: "🍟" },
      { name: "Veg Pasta", price: 90, veg: true, icon: "🍝", photoCategory: "pasta" },
      { name: "Garlic Bread", price: 70, veg: true, icon: "🥖" },
      { name: "Chicken Hot Dog", price: 65, veg: false, icon: "🌭" },
      { name: "Nachos", price: 65, veg: true, icon: "🧀" },
      { name: "Spring Rolls", price: 60, veg: true, icon: "🥢", photoCategory: "momos" },
    ],
  };

  const TAX_RATE = 0.05; // 5% tax

  // ---------- Category icons + photo colors ----------
  // Har category ke liye ek simple outline SVG icon (reference image jaisa)
  // aur ek gradient color-pair, jo product photo-badge ke background mein use hoga
  const CATEGORY_STYLE = {
    "Tea": {
      color: ["#5A4632", "#3E3122"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1-1 1-1 2s1 1 1 2M12 3c0 1-1 1-1 2s1 1 1 2"/></svg>'
    },
    "Coffee": {
      color: ["#4A3323", "#2E1F15"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2c0 1-1 1-1 2s1 1 1 2M12 2c0 1-1 1-1 2s1 1 1 2"/></svg>'
    },
    "Cold Drinks": {
      color: ["#2C5C6B", "#1D3D47"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M6 3h12l-1.2 16.5a2 2 0 0 1-2 1.5H9.2a2 2 0 0 1-2-1.5L6 3Z"/><path d="M5.5 7h13M14 3l3 4"/></svg>'
    },
    "Snacks": {
      color: ["#6B4A2C", "#4A331E"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M3 9a9 6 0 0 1 18 0Z"/><path d="M3 9l1.5 8a2 2 0 0 0 2 1.7h11a2 2 0 0 0 2-1.7L21 9"/></svg>'
    },
    "Pizza": {
      color: ["#7A3B2E", "#54271D"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2 2 20h20L12 2Z"/><circle cx="12" cy="12" r="1"/><circle cx="9" cy="16" r="1"/><circle cx="15" cy="16" r="1"/></svg>'
    },
    "Fast Food": {
      color: ["#6B4E1F", "#4A3512"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 10a8 5 0 0 1 16 0Z"/><path d="M3 10h18M4 13h16a1 1 0 0 1 1 1 3 3 0 0 1-3 3H6a3 3 0 0 1-3-3 1 1 0 0 1 1-1Z"/></svg>'
    }
  };

  // ---------- Step 2: State — abhi kaunsi category dikh rahi hai, cart mein kya hai ----------
  let activeCategory = Object.keys(CATALOG)[0]; // pehli category default mein selected
  let cart = [];

  // ---------- Step 3: Category tabs banana ----------
  function renderTabs() {
    const tabsDiv = document.getElementById('tabs');
    tabsDiv.innerHTML = '';

    Object.keys(CATALOG).forEach(function(category) {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (category === activeCategory ? ' active' : '');
      // Icon upar, naam neeche — reference image jaisa layout
      btn.innerHTML = CATEGORY_STYLE[category].svg + '<span>' + category + '</span>';
      btn.onclick = function() {
        activeCategory = category;
        renderTabs();  // active tab ka highlight update karo
        renderGrid();  // us category ke products dikhao
      };
      tabsDiv.appendChild(btn);
    });
  }

  // ---------- Step 4: Selected category ke products dikhana ----------
  function renderGrid() {
    const gridDiv = document.getElementById('grid');
    gridDiv.innerHTML = '';

    const colors = CATEGORY_STYLE[activeCategory].color;

    CATALOG[activeCategory].forEach(function(product) {
      const card = document.createElement('div');
      card.className = 'product-card';

      // Sirf un items pe icon dikhega jinke liye veg property set ki gayi hai
      // (Tea/Coffee/Cold Drinks mein veg property hi nahi hai, isliye unpe icon nahi aayega)
      let icon = '';
      if (product.veg === true) {
        icon = '<span class="veg-icon"></span>';
      } else if (product.veg === false) {
        icon = '<span class="nonveg-icon"></span>';
      }

      // Photo ki jagah — shuru mein colorful icon-badge dikhta hai.
      // Agar us product ke liye ek verified photoCategory hai, toh ye badge
      // async fetch complete hone ke baad real photo se replace ho jaayega.
      const photoHtml = `<div class="product-photo photo-fallback" style="--photo-a:${colors[0]};--photo-b:${colors[1]}">${product.icon || '🍽️'}</div>`;

      card.innerHTML = `
        ${photoHtml}
        <div class="pname">${icon}${product.name}</div>
        <div class="prow">
          <span class="pprice">₹${product.price}</span>
          <button class="add-btn">+ ADD</button>
        </div>
      `;

      // Agar is product ke liye accurate photo category hai, toh Foodish API se
      // asli photo mangwate hain. Ye ek "asynchronous" call hai — matlab result
      // turant nahi aata, thodi der baad aata hai, isliye .then() ke andar
      // photo ko badge ki jagah lagate hain jab wo aa jaaye.
      if (product.photoCategory) {
        fetch('https://foodish-api.com/api/images/' + product.photoCategory)
          .then(function(response) { return response.json(); })
          .then(function(data) {
            const img = document.createElement('img');
            img.className = 'product-photo';
            img.src = data.image;
            img.alt = product.name;
            img.loading = 'lazy';
            card.querySelector('.product-photo').replaceWith(img);
          })
          .catch(function() {
            // Fetch fail ho gaya (internet nahi hai, ya API down hai) —
            // koi baat nahi, icon-badge waisi hi dikhti rahegi
          });
      }

      // ADD button ko click event manually jodna (kyunki naam mein spaces ho sakte hain, jaise "Cold Drink")
      card.querySelector('.add-btn').onclick = function() {
        addToCart(product.name, product.price, product.icon);
      };
      gridDiv.appendChild(card);
    });
  }

  // ---------- Step 5: Product cart mein add karna ----------
  function addToCart(name, price, icon) {
    const existingItem = cart.find(function(item) {
      return item.name === name;
    });

    if (existingItem) {
      existingItem.qty = existingItem.qty + 1;
    } else {
      cart.push({ name: name, price: price, qty: 1, icon: icon });
    }

    updateCart();
  }

  // ---------- Step 6: Quantity +/- se badalna ----------
  function changeQty(index, amount) {
    cart[index].qty = cart[index].qty + amount;

    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }

    updateCart();
  }

  // ---------- Step 7: Quantity seedha type karke set karna ----------
  function setQty(index, newValue) {
    const newQty = parseInt(newValue);

    if (isNaN(newQty)) {
      updateCart();
      return;
    }

    if (newQty <= 0) {
      cart.splice(index, 1);
    } else {
      cart[index].qty = newQty;
    }

    updateCart();
  }

  // ---------- Step 8: Poora cart khali karna ----------
  function clearCart() {
    cart = [];
    updateCart();
  }

  // ---------- Step 9: Order panel ko screen pe update karna ----------
  function updateCart() {
    const cartItemsDiv = document.getElementById('cartItems');

    if (cart.length === 0) {
      cartItemsDiv.innerHTML = '<p class="empty-msg">No items yet.<br>Tap ADD on a product.</p>';
    } else {
      let html = '';
      cart.forEach(function(item, index) {
        const lineTotal = item.price * item.qty;
        html += `
          <div class="cart-item">
            <span><span class="cart-picon">${item.icon || ''}</span>${item.name} x${item.qty} — ₹${lineTotal}</span>
            <span>
              <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
              <input type="number" class="qty-input" value="${item.qty}" min="0" onchange="setQty(${index}, this.value)">
              <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            </span>
          </div>
        `;
      });
      cartItemsDiv.innerHTML = html;
    }

    // ---- Subtotal, Tax aur Due calculate karna ----
    const subtotal = cart.reduce(function(sum, item) {
      return sum + (item.price * item.qty);
    }, 0);
    const tax = subtotal * TAX_RATE;
    const due = subtotal + tax;

    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    document.getElementById('tax').textContent = tax.toFixed(2);
    document.getElementById('due').textContent = due.toFixed(2);
  }

  // ---------- Init: page load hote hi tabs aur products dikhao ----------
  renderTabs();
  renderGrid();
  updateCart();
</script>

</body>
</html>
