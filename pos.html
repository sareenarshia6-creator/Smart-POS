<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple POS System</title>
<style>
  /* ---------- Basic page styling ---------- */
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  /* Layout: products on left, cart on right */
  .container {
    display: flex;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
    flex-wrap: wrap;
  }

  .products, .cart {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }

  .products {
    flex: 2;
    min-width: 280px;
  }

  .cart {
    flex: 1;
    min-width: 250px;
  }

  /* Each product button */
  .product-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #eef3ff;
    border: 1px solid #cdd8f0;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
  }

  .product-btn:hover {
    background: #dbe6ff;
  }

  /* Each item in the cart */
  .cart-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
  }

  .remove-btn {
    background: #ffdddd;
    border: none;
    color: #b30000;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    margin-left: 8px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
    padding-top: 10px;
    border-top: 2px solid #333;
  }

  .clear-btn {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    background: #333;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
  }

  .clear-btn:hover {
    background: #555;
  }

  .empty-msg {
    color: #888;
  }
</style>
</head>
<body>

<h1>🛒 Simple POS System</h1>

<div class="container">

  <!-- ============ LEFT SIDE: PRODUCT LIST ============ -->
  <div class="products">
    <h2>Products</h2>
    <!-- Har button ek product hai. onclick se addToCart() function call hota hai -->
    <button class="product-btn" onclick="addToCart('Tea', 10)">Tea — ₹10</button>
    <button class="product-btn" onclick="addToCart('Coffee', 20)">Coffee — ₹20</button>
    <button class="product-btn" onclick="addToCart('Samosa', 15)">Samosa — ₹15</button>
    <button class="product-btn" onclick="addToCart('Sandwich', 40)">Sandwich — ₹40</button>
    <button class="product-btn" onclick="addToCart('Cold Drink', 30)">Cold Drink — ₹30</button>
    <button class="product-btn" onclick="addToCart('Biscuit', 5)">Biscuit — ₹5</button>
  </div>

  <!-- ============ RIGHT SIDE: CART ============ -->
  <div class="cart">
    <h2>Cart</h2>
    <div id="cartItems">
      <p class="empty-msg">Cart is empty.</p>
    </div>

    <div class="total-row">
      <span>Total</span>
      <span>₹<span id="totalAmount">0</span></span>
    </div>

    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
  </div>

</div>

<script>
  // ---------- Step 1: Cart data store karne ke liye ek empty array ----------
  // Har item is array mein { name: "Tea", price: 10 } jaisa dikhega
  let cart = [];

  // ---------- Step 2: Product add karne ka function ----------
  function addToCart(name, price) {
    cart.push({ name: name, price: price }); // naya item array mein daal do
    updateCart(); // screen update karo
  }

  // ---------- Step 3: Item cart se remove karne ka function ----------
  function removeFromCart(index) {
    cart.splice(index, 1); // us index ka item hata do
    updateCart();
  }

  // ---------- Step 4: Poora cart khali karne ka function ----------
  function clearCart() {
    cart = [];
    updateCart();
  }

  // ---------- Step 5: Cart ko screen pe dikhane wala function ----------
  function updateCart() {
    const cartItemsDiv = document.getElementById('cartItems');
    const totalAmountSpan = document.getElementById('totalAmount');

    // Agar cart khali hai
    if (cart.length === 0) {
      cartItemsDiv.innerHTML = '<p class="empty-msg">Cart is empty.</p>';
      totalAmountSpan.textContent = '0';
      return;
    }

    // Cart ke saare items ka HTML bana rahe hain
    let html = '';
    let total = 0;

    cart.forEach(function(item, index) {
      total = total + item.price;
      html += `
        <div class="cart-item">
          <span>${item.name} — ₹${item.price}</span>
          <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
        </div>
      `;
    });

    cartItemsDiv.innerHTML = html;
    totalAmountSpan.textContent = total;
  }
</script>

</body>
</html>
