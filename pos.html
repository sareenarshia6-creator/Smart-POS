<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POS System</title>
<style>
  :root {
    --bg: #1C1E22;              
    --card: #24272C;            
    --card-item: #2C2F35;       
    --card-border: #34373D;     
    --amber: #E3A438;           
    --green: #3FAE6B;           
    --green-dark: #2F8C55;      
    --text-light: #ECEDEE;      
    --text-light-muted: #9A9EA6;
    --paper: #F6F1E7;           
    --paper-border: #DED2B8;
    --paper-ink: #2B2620;       
    --paper-ink-muted: #8A8070;

    --danger: #C96A5A;
  }
  * { box-sizing: border-box; }
  .app-shell {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 210px;
    flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--card-border);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
  }
  .sidebar .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    color: var(--amber);
    font-size: 17px;
    margin: 0 8px 30px;
  }
  .sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--text-light-muted);
    font-size: 14px;
    cursor: pointer;
    background: none;
    border: none;
    text-align: left;
    width: 100%;
    font-family: inherit;
  }
  .nav-item svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    flex-shrink: 0;
  }
  .nav-item:hover:not(.active) {
    background: var(--card-item);
    color: var(--text-light);
  }
  .nav-item.active {
    background: rgba(227, 164, 56, 0.12);
    color: var(--amber);
    font-weight: 600;
  }
  .sidebar .logout {
    margin-top: auto;
  }
  .main-content {
    flex: 1;
    min-width: 0;
    padding: 22px 28px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--card-item);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 9px 14px;
    flex: 1;
    max-width: 340px;
    color: var(--text-light-muted);
  }
  .search-box svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    flex-shrink: 0;
  }
  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text-light);
    font-size: 14px;
    width: 100%;
    font-family: inherit;
  }
  .user-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-info {
    text-align: right;
    line-height: 1.35;
  }
  .user-info .uname {
    color: var(--text-light);
    font-weight: 600;
    font-size: 13.5px;
  }
  .user-info .ustatus {
    color: var(--text-light-muted);
    font-size: 11.5px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--amber), var(--danger));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1C1E22;
    font-weight: bold;
    font-size: 14px;
    flex-shrink: 0;
  }
  .bell-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-item);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-light-muted);
    cursor: pointer;
    flex-shrink: 0;
  }
  .bell-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
  }
  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--text-light);
  }
  h1 {
    text-align: center;
    color: var(--amber);
    margin-bottom: 20px;
  }
  .container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .products {
    flex: 2;
    min-width: 300px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 18px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-light-muted);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 64px;
  }
  .tab-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
  }
  .tab-btn.active {
    background: rgba(227, 164, 56, 0.12);
    border-color: var(--amber);
    color: var(--amber);
    font-weight: bold;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .product-card {
    background: var(--card-item);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }
  .product-photo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: linear-gradient(155deg, var(--photo-a, #3A3E46), var(--photo-b, #2C2F35));
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
  }
  .photo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  .product-card .pname {
    font-size: 13.5px;
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px; 
    line-height: 1.3;
  }
  
  .product-card .pname img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
  }
  .cart-picon {
    font-size: 16px;
    margin-right: 3px;
  }
  .veg-icon, .nonveg-icon {
    width: 11px;
    height: 11px;
    border: 1.5px solid;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .veg-icon {
    border-color: #2E9E4F;
  }
  .veg-icon::after {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2E9E4F;
  }
  .nonveg-icon {
    border-color: #A0342A;
  }
  .nonveg-icon::after {
    content: "";
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 6px solid #A0342A;
  }
  .product-card .prow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .product-card .pprice {
    color: var(--amber);
    font-size: 14px;
  }
  .add-btn {
    background: var(--green);
    color: white;
    border: none;
    padding: 6px 0;
    width: 100%;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .add-btn:hover {
    background: var(--green-dark);
  }
  .order-panel {
    flex: 1;
    min-width: 260px;
    background: var(--paper);
    border: 1px solid var(--paper-border);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
  }
  .order-panel h2 {
    color: var(--paper-ink);
    font-size: 16px;
    margin: 0 0 12px;
  }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--paper-border);
    color: var(--paper-ink);
    font-size: 14px;
  }
  .qty-btn {
    background: #FFFFFF;
    border: 1px solid var(--paper-border);
    color: var(--paper-ink);
    width: 22px;
    height: 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .qty-btn:hover {
    background: var(--amber);
    border-color: var(--amber);
    color: #fff;
  }
  .qty-input {
    width: 34px;
    height: 22px;
    text-align: center;
    border: 1px solid var(--paper-border);
    border-radius: 4px;
    font-size: 13px;
    margin: 0 4px;
    color: var(--paper-ink);
    background: #FFFFFF;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .empty-msg {
    color: var(--paper-ink-muted);
    text-align: center;
    padding: 20px 0;
    font-size: 14px;
  }
  .totals {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--paper-border);
  }
  .totals-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--paper-ink-muted);
    padding: 3px 0;
  }
  .totals-row.due {
    color: var(--paper-ink);
    font-size: 19px;
    font-weight: bold;
    border-top: 2px solid var(--amber);
    margin-top: 6px;
    padding-top: 8px;
  }
  .clear-btn {
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    background: var(--paper-ink);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }
  .clear-btn:hover {
    background: #000000;
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar">
    <div class="logo">🍽️ Foodlogo</div>
    <nav>
      <button class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>

  </div>
  <div class="main-content">
    <div class="topbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Search menu">
      </div>
    </div>
    <div class="container">
  <div class="products">

    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="order-panel">
    <h2>Current Order</h2>
    <div id="cartItems">
      <p class="empty-msg">No items yet.<br>Tap ADD on a product.</p>
    </div>
    <div class="totals">
      <div class="totals-row">
        <span>Subtotal</span>
        <span>₹<span id="subtotal">0</span></span>
      </div>
      <div class="totals-row">
        <span>Tax (5%)</span>
        <span>₹<span id="tax">0</span></span>
      </div>
      <div class="totals-row due">
        <span>Due</span>
        <span>₹<span id="due">0</span></span>
      </div>
    </div>

    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
  </div>
    </div>
  </div>
</div>
<script>
  const CATALOG = {
    "Tea": [
      { name: "Masala Chai", price: 10, icon: "images/mc.jpg", photoCategory: "chai" },
      { name: "Ginger Tea", price: 12, icon: "images/gt.jpg", photoCategory: "chai" },

    ],
    "Coffee": [

    "Cold Drinks": [
      { name: "Coca-Cola", price: 25, icon: "images/cc.jpg" },

      { name: "Sprite", price: 25, icon: "images/sprite.jpg" },
      { name: "Lemonade", price: 20, icon: "images/lemonade.jpg" },
      { name: "Iced Tea", price: 30, icon: "images/icetea.jpg" },
      { name: "Mojito", price: 40, icon: "images/mojito.jpg" },
    ],
    "Appitizers": [
      { name: "Samosa", price: 15, veg: true, icon: "images/samosa.jpg", photoCategory: "samosa" },
      { name: "Fries", price: 50, veg: true, icon: "images/fries.jpg" },
      { name: "Peri Peri Fries", price: 60, veg: true, icon: "images/ppfries.jpg" },
      { name: "Butter Chicken Fries", price: 80, veg: false, icon: "images/bcfries.jpg" },
      { name: "Pasta", price: 100, veg: true, icon: "images/pasta.jpg", photoCategory: "pasta" },
      { name: "Nachos", price: 90, veg: true, icon: "images/nachos.jpg" },
      { name: "Spring Rolls", price: 60, veg: true, icon: "images/spring.jpg", photoCategory: "momos" },
      { name: "Green & Garden Salad", price: 100, veg: true, icon: "images/ggsalad.jpg", photoCategory: "momos" },
      { name: "Protein & Legume Salad", price: 120, veg: true, icon: "images/pls.jpg", photoCategory: "momos" },
      { name: "Chicken Salad", price: 120, veg: false, icon: "images/csalad.jpg", photoCategory: "momos" },
    ],
    "Pizza": [
      { name: "Margherita Pizza", price: 140, veg: true, icon: "images/mp.jpg", photoCategory: "pizza" },
      { name: "Farmhouse Pizza", price: 170, veg: true, icon: "images/fp.jpg", photoCategory: "pizza" },
      { name: "Paneer Tikka Pizza", price: 180, veg: true, icon: "images/ptp.jpg", photoCategory: "pizza" },
      { name: "Chicken Pizza", price: 180, veg: false, icon: "images/cp.jpg", photoCategory: "pizza" },
      { name: "Pepperoni Pizza", price: 200, veg: false, icon: "images/pp.jpg", photoCategory: "pizza" },
    ],
    "Between the Breads": [
      { name: "Veg Burger", price: 55, veg: true, icon: "images/vb.jpg", photoCategory: "burger" },
      { name: "Chicken Burger", price: 75, veg: false, icon: "images/cb.jpg", photoCategory: "burger" },
      { name: "Garlic Bread", price: 70, veg: true, icon: "images/gb.jpg" },
      { name: "Chicken Hot Dog", price: 65, veg: false, icon: "images/chd.jpg" },
      { name: "Veg Sandwich", price: 35, veg: true, icon: "images/vs.jpg" },
      { name: "Chicken Sandwich", price: 70, veg: false, icon: "images/cs.jpg" },
      { name: "Paneer or Tofu Wrap", price: 60, veg: true, icon: "images/pw.jpg" },
      { name: "Chicken shawarma", price: 80, veg: false, icon: "images/csw.jpg" },

    ],
  };
  const TAX_RATE = 0.05; 
  const CATEGORY_STYLE = {
    "Tea": {
      color: ["#5A4632", "#3E3122"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1-1 1-1 2s1 1 1 2M12 3c0 1-1 1-1 2s1 1 1 2"/></svg>'
    },
    "Coffee": {
      color: ["#4A3323", "#2E1F15"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2c0 1-1 1-1 2s1 1 1 2M12 2c0 1-1 1-1 2s1 1 1 2"/></svg>'
    },
    "Cold Drinks": {
      color: ["#2C5C6B", "#1D3D47"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M6 3h12l-1.2 16.5a2 2 0 0 1-2 1.5H9.2a2 2 0 0 1-2-1.5L6 3Z"/><path d="M5.5 7h13M14 3l3 4"/></svg>'
    },
    "Appitizers": {
      color: ["#6B4A2C", "#4A331E"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M3 9a9 6 0 0 1 18 0Z"/><path d="M3 9l1.5 8a2 2 0 0 0 2 1.7h11a2 2 0 0 0 2-1.7L21 9"/></svg>'
    },
    "Pizza": {
      color: ["#7A3B2E", "#54271D"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2 2 20h20L12 2Z"/><circle cx="12" cy="12" r="1"/><circle cx="9" cy="16" r="1"/><circle cx="15" cy="16" r="1"/></svg>'
    },
    "Between the Breads": {
      color: ["#6B4E1F", "#4A3512"],
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 10a8 5 0 0 1 16 0Z"/><path d="M3 10h18M4 13h16a1 1 0 0 1 1 1 3 3 0 0 1-3 3H6a3 3 0 0 1-3-3 1 1 0 0 1 1-1Z"/></svg>'
    }
  };
  let activeCategory = Object.keys(CATALOG)[0]; 
  let cart = [];
  function renderTabs() {
    const tabsDiv = document.getElementById('tabs');
    tabsDiv.innerHTML = '';
    Object.keys(CATALOG).forEach(function(category) {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (category === activeCategory ? ' active' : '');
      btn.innerHTML = CATEGORY_STYLE[category].svg + '<span>' + category + '</span>';
      btn.onclick = function() {
        activeCategory = category;
        renderTabs();  
        renderGrid();  
      };
      tabsDiv.appendChild(btn);
    });
  }
  function renderGrid() {
    const gridDiv = document.getElementById('grid');
    gridDiv.innerHTML = '';
    const colors = CATEGORY_STYLE[activeCategory].color;
    CATALOG[activeCategory].forEach(function(product) {
      const card = document.createElement('div');
      card.className = 'product-card';
      let icon = '';
      if (product.veg === true) {
        icon = '<span class="veg-icon"></span>';
      } else if (product.veg === false) {
        icon = '<span class="nonveg-icon"></span>';
      }
      const photoHtml = ``;
      card.innerHTML = `
        ${photoHtml}
        <div class="pname"><img src="${product.icon}">${product.name}</div>
        <div class="prow">
          <span class="pprice">₹${product.price}</span>
          <button class="add-btn">+ ADD</button>
        </div>
      `;
      if (product.photoCategory) {
        fetch('https://foodish-api.com/api/images/' + product.photoCategory)
          .then(function(response) { return response.json(); })
          .then(function(data) {
            const img = document.createElement('img');
            img.className = 'product-photo';
            img.src = data.image;
            img.alt = product.name;
            img.loading = 'lazy';
            card.querySelector('.product-photo').replaceWith(img);
          })
          .catch(function() {
          });
      }
      card.querySelector('.add-btn').onclick = function() {
        addToCart(product.name, product.price, product.icon);
      };
      gridDiv.appendChild(card);
    });
  }
  function addToCart(name, price, icon) {
    const existingItem = cart.find(function(item) {
      return item.name === name;
    });
    if (existingItem) {
      existingItem.qty = existingItem.qty + 1;
    } else {
      cart.push({ name: name, price: price, qty: 1, icon: icon });
    }
    updateCart();
  }
  function changeQty(index, amount) {
    cart[index].qty = cart[index].qty + amount;

    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }
    updateCart();
  }
  function setQty(index, newValue) {
    const newQty = parseInt(newValue);
    if (isNaN(newQty)) {
      updateCart();
      return;
    }
    if (newQty <= 0) {
      cart.splice(index, 1);
    } else {
      cart[index].qty = newQty;
    }
    updateCart();
  }
  function clearCart() {
    cart = [];
    updateCart();
  }
  function updateCart() {
    const cartItemsDiv = document.getElementById('cartItems');
    if (cart.length === 0) {
      cartItemsDiv.innerHTML = '<p class="empty-msg">No items yet.<br>Tap ADD on a product.</p>';
    } else {
      let html = '';
      cart.forEach(function(item, index) {
        const lineTotal = item.price * item.qty;
        html += `
          <div class="cart-item">
            <span><span class="cart-picon">${item.icon || ''}</span>${item.name} x${item.qty} — ₹${lineTotal}</span>
            <span>
              <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
              <input type="number" class="qty-input" value="${item.qty}" min="0" onchange="setQty(${index}, this.value)">
              <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            </span>
          </div>
        `;
      });
      cartItemsDiv.innerHTML = html;
    }
    const subtotal = cart.reduce(function(sum, item) {
      return sum + (item.price * item.qty);
    }, 0);
    const tax = subtotal * TAX_RATE;
    const due = subtotal + tax;
    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    document.getElementById('tax').textContent = tax.toFixed(2);
    document.getElementById('due').textContent = due.toFixed(2);
  }
  renderTabs();
  renderGrid();
  updateCart();
</script>
</body>
</html>
