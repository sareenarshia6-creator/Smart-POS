<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POS System</title>
<style>
  :root {
    --bg: #1C1E22;             
    --card: #24272C;            
    --card-item: #2C2F35;       
    --card-border: #34373D;     
    --amber: #E3A438;           
    --green: #3FAE6B;           
    --green-dark: #2F8C55;      
    --text-light: #ECEDEE;      
    --text-light-muted: #9A9EA6;
    --paper: #F6F1E7;           
    --paper-border: #DED2B8;
    --paper-ink: #2B2620;     
    --paper-ink-muted: #8A8070;

    --danger: #C96A5A;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 20px;
    color: var(--text-light);
  }
  h1 {
    text-align: center;
    color: var(--amber);
    margin-bottom: 20px;
  }
  .container {
    display: flex;
    gap: 20px;
    max-width: 950px;
    margin: 0 auto;
    flex-wrap: wrap;
  }
  .products {
    flex: 2;
    min-width: 300px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 18px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-light-muted);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab-btn.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #1C1E22;
    font-weight: bold;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .product-card {
    background: var(--card-item);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .product-card .pname {
    font-size: 14.5px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .veg-icon, .nonveg-icon {
    width: 12px;
    height: 12px;
    border: 1.5px solid;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .veg-icon {
    border-color: #2E9E4F;
  }
  .veg-icon::after {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2E9E4F;
  }
  .nonveg-icon {
    border-color: #A0342A;
  }
  .nonveg-icon::after {
    content: "";
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 6px solid #A0342A;
  }
  .product-card .prow {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .product-card .pprice {
    color: var(--amber);
    font-size: 14px;
  }
  .add-btn {
    background: var(--green);
    color: white;
    border: none;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .add-btn:hover {
    background: var(--green-dark);
  }
  .order-panel {
    flex: 1;
    min-width: 260px;
    background: var(--paper);
    border: 1px solid var(--paper-border);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
  }
  .order-panel h2 {
    color: var(--paper-ink);
    font-size: 16px;
    margin: 0 0 12px;
  }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--paper-border);
    color: var(--paper-ink);
    font-size: 14px;
  }

  .qty-btn {
    background: #FFFFFF;
    border: 1px solid var(--paper-border);
    color: var(--paper-ink);
    width: 22px;
    height: 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .qty-btn:hover {
    background: var(--amber);
    border-color: var(--amber);
    color: #fff;
  }
  .qty-input {
    width: 34px;
    height: 22px;
    text-align: center;
    border: 1px solid var(--paper-border);
    border-radius: 4px;
    font-size: 13px;
    margin: 0 4px;
    color: var(--paper-ink);
    background: #FFFFFF;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .empty-msg {
    color: var(--paper-ink-muted);
    text-align: center;
    padding: 20px 0;
    font-size: 14px;
  }
  .totals {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--paper-border);
  }
  .totals-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--paper-ink-muted);
    padding: 3px 0;
  }
  .totals-row.due {
    color: var(--paper-ink);
    font-size: 19px;
    font-weight: bold;
    border-top: 2px solid var(--amber);
    margin-top: 6px;
    padding-top: 8px;
  }
  .clear-btn {
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    background: var(--paper-ink);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }

  .clear-btn:hover {
    background: #000000;
  }
</style>
</head>
<body>
<h1>🛒 POS System</h1>
<div class="container">
  <div class="products">
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="order-panel">
    <h2>Current Order</h2>

    <div id="cartItems">
      <p class="empty-msg">No items yet.<br>Tap ADD on a product.</p>
    </div>

    <div class="totals">
      <div class="totals-row">
        <span>Subtotal</span>
        <span>₹<span id="subtotal">0</span></span>
      </div>
      <div class="totals-row">
        <span>Tax (5%)</span>
        <span>₹<span id="tax">0</span></span>
      </div>
      <div class="totals-row due">
        <span>Due</span>
        <span>₹<span id="due">0</span></span>
      </div>
    </div>

    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
  </div>
</div>
<script>
  const CATALOG = {
    "Tea": [
      { name: "Masala Chai", price: 10, icon:"chai.png" },
      { name: "Ginger Tea", price: 12 },
      { name: "Lemon Tea", price: 12 },
      { name: "Green Tea", price: 15 },
      { name: "Kesar Chai", price: 20 },
    ],
    "Coffee": [
      { name: "Black Coffee", price: 15 },
      { name: "Espresso", price: 25 },
      { name: "Cappuccino", price: 30 },
      { name: "Latte", price: 35 },
      { name: "Cold Coffee", price: 40 },
      { name: "Mocha", price: 40 },
    ],
    "Cold Drinks": [
      { name: "Coca-Cola", price: 25 },
      { name: "Pepsi", price: 25 },
      { name: "Sprite", price: 25 },
      { name: "Lemonade", price: 20 },
      { name: "Iced Tea", price: 30 },
      { name: "Mojito", price: 40 },
    ],
    "Snacks": [
      { name: "Samosa", price: 15, veg: true },
      { name: "Veg Sandwich", price: 35, veg: true },
      { name: "Chicken Sandwich", price: 50, veg: false },
      { name: "Biscuit", price: 5, veg: true },
    ],
    "Pizza": [
      { name: "Margherita Pizza", price: 140, veg: true },
      { name: "Farmhouse Pizza", price: 170, veg: true },
      { name: "Paneer Tikka Pizza", price: 180, veg: true },
      { name: "Chicken Pizza", price: 180, veg: false },
      { name: "Pepperoni Pizza", price: 200, veg: false },
    ],
    "Fast Food": [
      { name: "Veg Burger", price: 55, veg: true },
      { name: "Chicken Burger", price: 75, veg: false },
      { name: "Fries", price: 50, veg: true },
      { name: "Veg Pasta", price: 90, veg: true },
      { name: "Garlic Bread", price: 70, veg: true },
      { name: "Chicken Hot Dog", price: 65, veg: false },
      { name: "Nachos", price: 65, veg: true },
      { name: "Spring Rolls", price: 60, veg: true },
    ],
  };
  const TAX_RATE = 0.05; 
  let activeCategory = Object.keys(CATALOG)[0]; 
  let cart = [];
  function renderTabs() {
    const tabsDiv = document.getElementById('tabs');
    tabsDiv.innerHTML = '';
    Object.keys(CATALOG).forEach(function(category) {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (category === activeCategory ? ' active' : '');
      btn.textContent = category;
      btn.onclick = function() {
        activeCategory = category;
        renderTabs();  // active tab ka highlight update karo
        renderGrid();  
      };
      tabsDiv.appendChild(btn);
    });
  }
  function renderGrid() {
    const gridDiv = document.getElementById('grid');
    gridDiv.innerHTML = '';

    CATALOG[activeCategory].forEach(function(product) {
      const card = document.createElement('div');
      card.className = 'product-card';
      let icon = '';
      if (product.veg === true) {
        icon = '<span class="veg-icon"></span>';
      } else if (product.veg === false) {
        icon = '<span class="nonveg-icon"></span>';
      }
      card.innerHTML = `
        <div class="pname">${icon}${product.name}</div>
        <div class="prow">
          <span class="pprice">₹${product.price}</span>
          <button class="add-btn">ADD</button>
        </div>
      `;
      card.querySelector('.add-btn').onclick = function() {
        addToCart(product.name, product.price);
      };
      gridDiv.appendChild(card);
    });
  }
  function addToCart(name, price) {
    const existingItem = cart.find(function(item) {
      return item.name === name;
    });

    if (existingItem) {
      existingItem.qty = existingItem.qty + 1;
    } else {
      cart.push({ name: name, price: price, qty: 1 });
    }
    updateCart();
  }
  function changeQty(index, amount) {
    cart[index].qty = cart[index].qty + amount;

    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }
    updateCart();
  }
  function setQty(index, newValue) {
    const newQty = parseInt(newValue);
    if (isNaN(newQty)) {
      updateCart();
      return;
    }
    if (newQty <= 0) {
      cart.splice(index, 1);
    } else {
      cart[index].qty = newQty;
    }
    updateCart();
  }
  function clearCart() {
    cart = [];
    updateCart();
  }
  function updateCart() {
    const cartItemsDiv = document.getElementById('cartItems');
    if (cart.length === 0) {
      cartItemsDiv.innerHTML = '<p class="empty-msg">No items yet.<br>Tap ADD on a product.</p>';
    } else {
      let html = '';
      cart.forEach(function(item, index) {
        const lineTotal = item.price * item.qty;
        html += `
          <div class="cart-item">
            <span>${item.name} x${item.qty} — ₹${lineTotal}</span>
            <span>
              <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
              <input type="number" class="qty-input" value="${item.qty}" min="0" onchange="setQty(${index}, this.value)">
              <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            </span>
          </div>
        `;
      });
      cartItemsDiv.innerHTML = html;
    }
    const subtotal = cart.reduce(function(sum, item) {
      return sum + (item.price * item.qty);
    }, 0);
    const tax = subtotal * TAX_RATE;
    const due = subtotal + tax;
    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    document.getElementById('tax').textContent = tax.toFixed(2);
    document.getElementById('due').textContent = due.toFixed(2);
  }
  renderTabs();
  renderGrid();
  updateCart();
</script>
</body>
</html>
